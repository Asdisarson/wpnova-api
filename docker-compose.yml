version: '3.8'

services:
  # Node.js API service
  wpnova-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - USERNAME=${USERNAME}
      - PASSWORD=${PASSWORD}
      - DOWNLOAD_URL=${DOWNLOAD_URL}
    volumes:
      - ./public:/home/node/app/public
    restart: unless-stopped
